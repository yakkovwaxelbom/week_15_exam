apiVersion: apps/v1
kind: Deployment
metadata:
  name: week-15-api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: week-15-api-pod
        image: yakov234/week_15_exam:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
